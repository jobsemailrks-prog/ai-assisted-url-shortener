spring:
  application:
    name: ai-assisted-url-shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway (below) is the single source of truth for schema. `validate` makes Hibernate
      # confirm the entity mappings match the migrated schema at startup and fail fast on
      # drift, instead of silently auto-creating/altering tables (previous `update` setting
      # meant the V1 migration below was never actually exercised - fixed as part of review).
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    default-ttl-minutes: 60