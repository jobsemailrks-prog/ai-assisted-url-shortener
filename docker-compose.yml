version: '3.8'

services:
  urlshortener:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./src/main/resources/db/migration:/app/src/main/resources/db/migration
    networks:
      - urlshortener-network

networks:
  urlshortener-network:
    driver: bridge